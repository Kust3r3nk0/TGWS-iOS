name: iOS Simulator Build
on:
  workflow_dispatch:
  pull_request:
jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build for iOS Simulator (unsigned)
        run: xcodebuild -project TGWSiOS.xcodeproj -scheme TGWSiOS -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
