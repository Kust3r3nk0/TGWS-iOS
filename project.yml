name: TGWSiOS
options:
  bundleIdPrefix: io.github.kust3r3nk0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  TGWSCore:
    path: Packages/TGWSCore
targets:
  TGWSiOS:
    type: application
    platform: iOS
    sources:
      - path: TGWSApp
    dependencies:
      - package: TGWSCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kust3r3nk0.tgwsios
        PRODUCT_NAME: TGWS-iOS
        INFOPLIST_KEY_CFBundleDisplayName: TGWS-iOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  TGWSiOS:
    build:
      targets:
        TGWSiOS: all
